name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install standalone PowerShell
        shell: python
        run: |
          import runpy
          runpy.run_path('tools/bootstrap_ci.py', run_name='__main__')
      - name: Verify shell and install build dependencies
        shell: .cache/pwsh/pwsh.exe -NoProfile -File {0}
        run: |
          [Console]::InputEncoding=[Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding=[Text.UTF8Encoding]::new($false)
          if($PSVersionTable.PSVersion -lt [version]'7.6.4'){throw 'Unsupported PowerShell'}
          (Get-Process -Id $PID).Path
          $PSVersionTable.PSVersion.ToString()
          python -m pip install -r requirements-build.txt
          if($LASTEXITCODE -ne 0){throw 'Dependency installation failed'}
      - name: Verify tag and build
        shell: .cache/pwsh/pwsh.exe -NoProfile -File {0}
        run: |
          $version=(Get-Content -LiteralPath control-center/VERSION -Raw -Encoding utf8).Trim()
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version"){throw 'Tag/version mismatch'}
          ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GameControlCenter-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish approved version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: .cache/pwsh/pwsh.exe -NoProfile -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content -LiteralPath control-center/VERSION -Raw -Encoding utf8).Trim()
          gh release create "v$version" "dist/GameControlCenter-$version-windows-x64.zip" dist/SHA256SUMS.txt --verify-tag --title "手机游戏控制台 v$version" --notes-file docs/RELEASE_NOTES.md
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
